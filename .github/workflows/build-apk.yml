name: Build PrintGo APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    # Printer drivers (Epson ESC/P-R, Gutenprint, HPLIP hpcups, SpliX) built from source for Android, plus the
    # driver catalog and the downloadable data packs. Cached until something under native/ changes.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore driver build
        id: cache
        uses: actions/cache@v4
        with:
          path: native-out
          key: native-v1-${{ hashFiles('native/**') }}
      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build zlib1g-dev
      - name: Build drivers
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          echo "NDK: ${ANDROID_NDK_LATEST_HOME:-} ${ANDROID_NDK_HOME:-}" | tee "$RUNNER_TEMP/native.log"
          for t in host arm64-v8a armeabi-v7a x86_64; do
            native/build.sh "$t" native-out 2>&1 | tee -a "$RUNNER_TEMP/native.log"
          done
          python3 native/tools/make_packs.py native-out 2>&1 | tee -a "$RUNNER_TEMP/native.log"
          rm -rf native-out/work native-out/host
      - name: Upload drivers
        uses: actions/upload-artifact@v4
        with:
          name: native-drivers
          path: |
            native-out/jniLibs
            native-out/assets
            native-out/packs
          if-no-files-found: error
      - name: Publish data packs (release "driver-packs")
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view driver-packs --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create driver-packs --repo "$GITHUB_REPOSITORY" --title "PrintGo driver packs" --prerelease \
              --notes "Printer data (Gutenprint XML, HPLIP and SpliX PPD files) that PrintGo downloads when a printer needs it. Data only; all program code is inside the app."
          have=$(gh release view driver-packs --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for f in native-out/packs/*.zip; do
            n=$(basename "$f")
            echo "$have" | grep -qx "$n" || gh release upload driver-packs "$f" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish native log to branch (on failure)
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          tail -n 8000 "$RUNNER_TEMP/native.log" > "$RUNNER_TEMP/logs/native.log" || true
          find native-out/work -name "*.log" -newer native/build.sh 2>/dev/null | while read f; do
            mkdir -p "$RUNNER_TEMP/logs/$(dirname "$f")"; tail -n 400 "$f" > "$RUNNER_TEMP/logs/$f"; done || true
          cd "$RUNNER_TEMP/logs"
          git init -q -b ci-logs-native
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Native log for run ${{ github.run_id }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs-native

  build:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add printer drivers
        uses: actions/download-artifact@v4
        with:
          name: native-drivers
          path: native-out
      - name: Place drivers in the app
        run: |
          mkdir -p app/src/main/jniLibs app/src/main/assets
          cp -a native-out/jniLibs/. app/src/main/jniLibs/
          cp -a native-out/assets/. app/src/main/assets/
          ls -R app/src/main/jniLibs | head -40

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PrintGo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release (easy phone download)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/PrintGo-debug.apk"
          gh release delete latest-debug --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest-debug "$RUNNER_TEMP/PrintGo-debug.apk" --repo "$GITHUB_REPOSITORY" \
            --title "PrintGo debug build" --prerelease \
            --notes "Latest debug APK from commit ${GITHUB_SHA::7}. Open this page on your phone and tap PrintGo-debug.apk."

      - name: Publish build log to branch (on failure)
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          tail -n 6000 "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/logs/build.log" || true
          cd "$RUNNER_TEMP/logs"
          git init -q -b ci-logs-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build log for run ${{ github.run_id }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs-build

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Run unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Publish test log to branch (on failure)
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          tail -n 6000 "$RUNNER_TEMP/test.log" > "$RUNNER_TEMP/logs/test.log" || true
          cp app/build/test-results/testDebugUnitTest/*.xml "$RUNNER_TEMP/logs/" 2>/dev/null || true
          cd "$RUNNER_TEMP/logs"
          git init -q -b ci-logs-tests
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Test log for run ${{ github.run_id }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs-tests

  release-check:
    # Makes sure the shrunk (R8) release build still compiles. The APK is unsigned and not published.
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-drivers
          path: native-out
      - run: |
          mkdir -p app/src/main/jniLibs app/src/main/assets
          cp -a native-out/jniLibs/. app/src/main/jniLibs/
          cp -a native-out/assets/. app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Assemble release
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/release.log"
      - name: Publish release log to branch (on failure)
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          tail -n 6000 "$RUNNER_TEMP/release.log" > "$RUNNER_TEMP/logs/release.log" || true
          cd "$RUNNER_TEMP/logs"
          git init -q -b ci-logs-release
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Release log for run ${{ github.run_id }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs-release
